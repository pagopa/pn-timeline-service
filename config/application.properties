logging.config=config/logback-local.xml

spring.application.name=PN-TIMELINE-SERVICE

# Runtime mode
pn.env.runtime=DEVELOPMENT
#pn.env.runtime=PROD

aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566

pn.timeline-service.data-vault-base-url=http://localhost:8084

pn.timeline-service.timeline-dao.table-name=pn-Timelines
pn.timeline-service.timelinecounter-dao.table-name=pn-TimelinesCounters
pn.timeline-service.last-poll-for-future-action-dao.lock-table-name=PnDeliveryPushShedLock

pn.timeline-service.featureunreachablerefinementpostaarstartdate=2024-11-27T00:00:00Z
pn.timeline-service.pfnewworkflowstart=2099-02-13T23:00:00Z
pn.timeline-service.pfnewworkflowstop=2099-03-31T23:00:00Z

pn.timeline-service.timelinelockduration=60s

management.endpoints.web.exposure.include=health,metrics,loggers

pn.timeline-service.invalidable-categories=PREPARE_ANALOG_DOMICILE,PREPARE_ANALOG_DOMICILE_FAILURE,SEND_ANALOG_DOMICILE,SEND_ANALOG_PROGRESS,SEND_ANALOG_FEEDBACK,ANALOG_SUCCESS_WORKFLOW,ANALOG_FAILURE_WORKFLOW,SCHEDULE_REFINEMENT,REFINEMENT,COMPLETELY_UNREACHABLE_CREATION_REQUEST,COMPLETELY_UNREACHABLE,ANALOG_WORKFLOW_RECIPIENT_DECEASED
